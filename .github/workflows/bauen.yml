name: Build Integration

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: "Create release v.<version from driver.json> with the package"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the package to the release on version tags

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (for tests)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run end-to-end test (mock receiver)
        run: |
          python -m pip install -r requirements.txt websockets
          python tests/test_e2e.py
          python tests/test_roon.py
          python tests/test_remote_roon.py

      - name: Fetch version
        id: version
        run: |
          VERSION=$(cat driver.json | jq -r '.version')
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build with PyInstaller (aarch64)
        run: |
          docker run --rm --name builder \
            --platform=linux/arm64 \
            --user=$(id -u):$(id -g) \
            -v "$PWD":/workspace \
            docker.io/unfoldedcircle/r2-pyinstaller:3.11.13 \
            bash -c \
              "PYTHON_VERSION=\$(python --version | cut -d' ' -f2 | cut -d. -f1,2) && \
              python -m pip install --user -r requirements.txt && \
              PYTHONPATH=~/.local/lib/python\${PYTHON_VERSION}/site-packages:\$PYTHONPATH \
              pyinstaller --clean --onedir --name driver -y intg-onkyoavr/driver.py"

      - name: Create installation package
        run: |
          # Create package directory structure
          PKG_DIR=ucr2-intg-onkyoavr-${{ steps.version.outputs.VERSION }}
          mkdir -p ${PKG_DIR}/bin
          mkdir -p ${PKG_DIR}/config
          
          # Copy driver binary and dependencies
          cp -r dist/driver/* ${PKG_DIR}/bin/
          
          # Ensure executable
          chmod +x ${PKG_DIR}/bin/driver
          
          # Copy driver metadata
          cp driver.json ${PKG_DIR}/

          # Driver icon (driver.json: "icon": "custom:onkyo.png") must be in the archive root
          cp assets/onkyo.png ${PKG_DIR}/
          
          # Create tarball with correct structure
          tar czvf ${PKG_DIR}.tar.gz -C ${PKG_DIR} .
          
          # Verify structure
          echo "=== Package contents ==="
          tar -tzvf ${PKG_DIR}.tar.gz | head -30

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ucr2-intg-onkyoavr-${{ steps.version.outputs.VERSION }}
          path: ucr2-intg-onkyoavr-${{ steps.version.outputs.VERSION }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Attach package to release (version tags or manual run with 'release')
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="v.${{ steps.version.outputs.VERSION }}"; fi
          PKG=ucr2-intg-onkyoavr-${{ steps.version.outputs.VERSION }}.tar.gz
          VERSION=${{ steps.version.outputs.VERSION }}
          # release notes = this version's section of CHANGELOG.md
          awk -v v="[$VERSION]" 'index($0, "## ")==1 {f = (index($0, v) > 0); next} f' CHANGELOG.md > notes.md
          printf '\n## Installation\nDownload `%s` below and upload it in the web configurator under Integrations. Your existing configuration is kept.\n' "$PKG" >> notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          gh release upload "$TAG" "$PKG" --clobber
